# Identificadores del proyecto en SonarQube / SonarCloud
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Rutas de código fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte XML de cobertura generado por JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusiones del análisis (Decisión de Diseño 2):
# Se mantiene deliberadamente sin exclusiones (o vacía) ya que el 100% de los archivos
# pertenecen a lógica de negocio/dominio esencial bajo evaluación técnica y no existen
# clases Main de bootstrap sin lógica ni wrappers generados.
sonar.exclusions=

# URL del servidor local y modo asíncrono
sonar.host.url=http://localhost:9000
sonar.qualitygate.wait=false
